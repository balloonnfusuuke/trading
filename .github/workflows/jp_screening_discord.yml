# Mac / PC がオフでも平日 15:10 JST 前後に日本株スクリーニングを Discord へ送る。
# リポジトリの Secrets に TV_SESSION_ID と DISCORD_WEBHOOK_URL を登録すること。
# Mac でも常に同時刻に動かすと二重通知になるため、クラウド本番にする場合はローカルの常駐を止める。
name: JP screening → Discord

on:
  schedule:
    # 15:10 JST = 06:10 UTC（月〜金）
    - cron: "10 6 * * 1-5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Secrets の確認
        env:
          TV_SESSION_ID: ${{ secrets.TV_SESSION_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$TV_SESSION_ID" ] || [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Settings → Secrets → Actions で TV_SESSION_ID と DISCORD_WEBHOOK_URL を両方設定してください（名前は大文字小文字まで一致）。"
            exit 1
          fi

      - name: Install deps
        run: pip install -r requirements.txt

      # config.py は秘密のため Git に含めていない。CI では example を複製し Secrets は環境変数で上書き。
      - name: config.py を生成
        run: cp config.example.py config.py

      - name: Run JP screening
        env:
          PYTHONUNBUFFERED: "1"
          TV_SESSION_ID: ${{ secrets.TV_SESSION_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --jp-now
