# Mac / PC がオフでも平日 15:10 JST 前後に日本株スクリーニングを Discord へ送る。
# Secrets: TV_SESSION_ID, DISCORD_WEBHOOK_URL
#
# ■ 手元と同じ内容のレポートにするには
#   リポジトリに positions.json と pnl_log.csv をコミットする（Private 必須）。
#   Actions は毎回クリーンなので、この2つが無いと保有・累計・クローズ履歴が空になる。
#   ローカルで main 実行後に変更があれば push してから定時実行させる。
#
# ■ スクリーニング件数が常に 0 だけになる場合
#   TradingView がデータセンター IP を弾いている可能性あり。セッション更新も確認。
#
# ■ ローカル実行と「完全に同じ」Discord にしたい場合
#   ① 同一コミット: positions.json / pnl_log.csv / main.py を push した状態で実行する。
#   ② Secrets の TV_SESSION_ID がローカル config と同じ最新値であること。
#   ③ 上記でもスクリーニング結果だけ違う → GitHub の IP からは TV が別応答を返している。
#      そのときは「自宅 PC / Mac を self-hosted runner」にするか、スクリーニングはローカルだけにする。
#      https://docs.github.com/actions/hosting-your-own-runners
name: JP screening → Discord

on:
  schedule:
    # 15:10 JST = 06:10 UTC（月〜金）
    - cron: "10 6 * * 1-5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Secrets の確認
        env:
          TV_SESSION_ID: ${{ secrets.TV_SESSION_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$TV_SESSION_ID" ] || [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Settings → Secrets → Actions で TV_SESSION_ID と DISCORD_WEBHOOK_URL を両方設定してください（名前は大文字小文字まで一致）。"
            exit 1
          fi
          echo "TV_SESSION_ID 文字数: ${#TV_SESSION_ID}"
          echo "DISCORD_WEBHOOK_URL 文字数: ${#DISCORD_WEBHOOK_URL} （目安 110〜130 前後）"
          case "$DISCORD_WEBHOOK_URL" in
            https://discord.com/api/webhooks/*|https://discordapp.com/api/webhooks/*)
              echo "Discord Webhook URL の先頭形式: OK"
              ;;
            *)
              echo "::warning::URL が https://discord.com/api/webhooks/ で始まっていません。コピー漏れ・余計なスペースがないか確認してください。"
              ;;
          esac

      - name: Install deps
        run: pip install -r requirements.txt

      # config.py は秘密のため Git に含めていない。CI では example を複製し Secrets は環境変数で上書き。
      - name: config.py を生成
        run: cp config.example.py config.py

      - name: 状態ファイル（手元と揃えるなら Git にコミット）
        run: |
          if [ -f positions.json ]; then
            echo "✓ positions.json あり（リポジトリから取得）"
            python -c "import json;d=json.load(open('positions.json'));jp=[p for p in d.get('jp',[])if p.get('status')=='open'];print('  日本株オープン:',len(jp),'件')"
          else
            echo "::warning::positions.json がありません。保有は空としてレポートされます。"
          fi
          if [ -f pnl_log.csv ]; then
            echo "✓ pnl_log.csv あり"
          else
            echo "::warning::pnl_log.csv がありません。【累計損益】は 0 になります。"
          fi

      - name: Run JP screening
        env:
          PYTHONUNBUFFERED: "1"
          TV_SESSION_ID: ${{ secrets.TV_SESSION_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --jp-now
