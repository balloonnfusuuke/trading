# 4:40 JST 前後の米国株スクリーニング（Mac オフ時のバックアップ用）
# Secrets: TV_SESSION_ID, DISCORD_WEBHOOK_URL
name: US screening → Discord

on:
  schedule:
    # 月〜土の朝 JST 4:40 ≒ 前日 19:40 UTC（日=0 … 金=5）
    - cron: "40 19 * * 0,1,2,3,4,5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Secrets の確認
        env:
          TV_SESSION_ID: ${{ secrets.TV_SESSION_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$TV_SESSION_ID" ] || [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::Settings → Secrets → Actions で TV_SESSION_ID と DISCORD_WEBHOOK_URL を両方設定してください。"
            exit 1
          fi

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run US screening
        env:
          TV_SESSION_ID: ${{ secrets.TV_SESSION_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --us-now
